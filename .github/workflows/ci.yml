name: CI

on:
  pull_request:
    branches: [next, main]
  push:
    branches: [next, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main solo se actualiza vía PR y ese PR tiene que venir de "next" -
  # consolidamos ahí antes de tocar la rama que dispara releases.
  enforce-main-source:
    name: Solo next puede mergear a main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar rama de origen del PR
        run: |
          if [ "${{ github.head_ref }}" != "next" ]; then
            echo "::error::main solo acepta Pull Requests desde 'next' (esta viene de '${{ github.head_ref }}')"
            exit 1
          fi

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Instalar paquetes del SDK necesarios
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0" > /dev/null
      - name: Lint
        run: ./gradlew lintDebug --console=plain

  unit-tests:
    name: Unit tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Instalar paquetes del SDK necesarios
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0" > /dev/null
      - name: Tests unitarios de dominio y UI
        run: ./gradlew testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

  build-debug:
    name: Build debug APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Instalar paquetes del SDK necesarios
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0" > /dev/null
      - name: Compilar APK debug
        run: ./gradlew assembleDebug --console=plain

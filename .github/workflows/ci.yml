name: CI

# Solo corre en Pull Requests, nunca en push directo - un push directo a
# next/main no debería existir (las ramas están protegidas), y si
# llegara a pasar no tiene sentido validar algo que ya se mergeó. main
# tiene su propio disparador de push en release.yml (build+firma+publish).
on:
  pull_request:
    branches: [next, main]

# Minimo privilegio a nivel workflow - ningun job de este archivo necesita
# escribir nada (release.yml es el unico que escribe, y ya declara su
# propio "permissions: contents: write" a nivel job).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main solo se actualiza vía PR, y ese PR tiene que venir de "next"
  # (consolidamos ahí antes de tocar la rama que dispara releases) o de
  # una rama "hotfix/*" para arreglos urgentes que no pueden esperar el
  # paso completo por next - a cambio, un hotfix corre su propio lint
  # (job validate-hotfix) en vez del pipeline completo de next.
  enforce-main-source:
    name: Solo next puede mergear a main
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar rama de origen del PR
        # HEAD_REF va por env, no interpolado directo en el script: el
        # nombre de una rama lo elige quien abre el PR y las reglas de
        # git permiten backticks/$()/;/&&/etc en un nombre de rama - una
        # interpolacion directa de "${{ github.head_ref }}" acá adentro
        # del bloque `run:` es una inyección de shell clásica y real
        # (cualquiera podría abrir un PR desde una rama con un nombre
        # armado para ejecutar comandos en el runner). Con env, el valor
        # llega como texto plano a la shell, no como código.
        #
        # Ademas se exige que el PR venga del propio repo (no de un
        # fork): antes, cualquiera podia nombrar su rama "next" o
        # "hotfix/algo" y pasar este guard sin ser realmente la rama
        # next real del proyecto ni una emergencia legitima.
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::main solo acepta Pull Requests desde ramas de este mismo repositorio, no de forks (viene de '$HEAD_REPO')"
            exit 1
          fi
          if [ "$HEAD_REF" != "next" ] && [[ "$HEAD_REF" != hotfix/* ]]; then
            echo "::error::main solo acepta Pull Requests desde 'next' o desde una rama 'hotfix/*' (esta viene de '$HEAD_REF')"
            exit 1
          fi

  validate-hotfix:
    name: Validate hotfix
    if: github.base_ref == 'main' && startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Cachear paquetes del Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
          key: android-sdk-37.0-37.1-build-tools-37.0.0
      - name: Instalar paquetes del SDK necesarios
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0" > /dev/null
      - name: Lint
        run: ./gradlew lintDebug --console=plain

  validate:
    name: Validate
    if: github.base_ref == 'next'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Cachear paquetes del Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
          key: android-sdk-37.0-37.1-build-tools-37.0.0
      - name: Instalar paquetes del SDK necesarios
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0" > /dev/null
      - name: Lint
        run: ./gradlew lintDebug --console=plain

  unit-tests:
    name: Unit tests
    if: github.base_ref == 'next'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Cachear paquetes del Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
          key: android-sdk-37.0-37.1-build-tools-37.0.0
      - name: Instalar paquetes del SDK necesarios
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0" > /dev/null
      - name: Tests unitarios de dominio y UI
        run: ./gradlew testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

  build-debug:
    name: Build debug APK
    if: github.base_ref == 'next'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Cachear paquetes del Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
          key: android-sdk-37.0-37.1-build-tools-37.0.0
      - name: Instalar paquetes del SDK necesarios
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0" > /dev/null
      - name: Compilar APK debug
        run: ./gradlew assembleDebug --console=plain

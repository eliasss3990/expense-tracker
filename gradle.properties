org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Build cache de Gradle: cachea outputs de tareas (ej. compileDebugKotlin)
# por hash de inputs, no por nombre de tarea. Combinado con que el CI
# persiste ~/.gradle entre runs (gradle/actions/setup-gradle), esto evita
# que jobs paralelos que compilan lo mismo (unit-tests y build-debug)
# recompilen dos veces desde cero.
org.gradle.caching=true
org.gradle.parallel=true
